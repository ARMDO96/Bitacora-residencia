<style>
@font-face{font-family:"Fraunces";src:url(fonts/fraunces.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Fraunces";src:url(fonts/fraunces-italic.woff2) format("woff2");font-weight:100 900;font-style:italic;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito.woff2) format("woff2");font-weight:200 1000;font-style:normal;font-display:swap}
/* Layout: libreta de residencia — cabecera de color con fecha en serif cursiva, tarjetas redondeadas con color por tipo de actividad, barra flotante abajo */
:root{
  --bg:#F6F3F8; --surface:#FFFFFF; --ink:#2A2140; --muted:#6E6585; --line:#E6E0EE;
  --plum:#4B3A7A; --plum-deep:#33275A; --plum-soft:#ECE6F7; --on-plum:#FFFFFF;
  --rose:#C2577A; --rose-soft:#FBE8EF; --on-rose:#FFFFFF;
  --sage:#4E8A6E; --sage-soft:#E3F1EA;
  --gold:#B07A1E; --gold-soft:#FBF0DA;
  --ok:#3E7E5C; --ok-soft:#E1F2E8; --bad:#B4435A; --bad-soft:#FBE4E8; --off:#7A7287; --off-soft:#EFECF3;
  --warn:#9A6410; --warn-soft:#FCF0D9;
  --shadow:0 1px 2px rgba(51,39,90,.06),0 6px 18px rgba(51,39,90,.07);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17131F; --surface:#221C2E; --ink:#EDE8F5; --muted:#A99FBE; --line:#342B45;
  --plum:#B9A6F0; --plum-deep:#2C2246; --plum-soft:#2F2648; --on-plum:#1A1426;
  --rose:#EE9AB5; --rose-soft:#3F2230; --on-rose:#2A1530;
  --sage:#8DCBAE; --sage-soft:#1F3329;
  --gold:#E8BD6A; --gold-soft:#3A2E17;
  --ok:#93D2AE; --ok-soft:#1E3427; --bad:#F09AAB; --bad-soft:#40202A; --off:#B4ABC4; --off-soft:#2B2538;
  --warn:#EFC16D; --warn-soft:#3B2D14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.25);
  color-scheme:dark}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{width:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.wrap>*{min-width:0}
h1,h2,h3{font-family:var(--display);font-variation-settings:"SOFT" 100;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:17px;font-weight:600;letter-spacing:.02em}
h2{font-size:22px;font-weight:600}
h3{font-size:21px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14.5px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--rose);outline-offset:2px}

.hero{background:var(--plum-deep);color:#F4EFFC;border-radius:0 0 32px 32px;padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 22px max(20px,env(safe-area-inset-left,0px));margin-bottom:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(194,87,122,.45),rgba(194,87,122,0) 70%);pointer-events:none}
.hero .inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.hero .brand{display:flex;align-items:center;gap:10px}
.hero .brand .mark{width:30px;height:30px;border-radius:10px;background:#C2577A;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-weight:700;color:#fff;font-size:17px}
.hero .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#C9BDE6}
#status{font-size:14px;color:#D8CFEE}
#status.warn{color:#F6CF86}

.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;min-height:44px;font-weight:600}
.btn.primary{background:var(--plum);color:var(--on-plum);border-color:var(--plum);box-shadow:var(--shadow)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.field{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 14px;min-height:46px}
.field:focus{border-color:var(--plum)}
textarea.field{min-height:56px;resize:vertical;border-radius:18px}
select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
label.small{display:flex;flex-direction:column;gap:4px}
.banner{border-radius:18px;padding:12px 14px;font-size:14px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.off{background:var(--off-soft);color:var(--off)}

.daynav{display:flex;align-items:center;gap:10px}
.daynav .d{flex:1;min-width:0;text-align:center}
.daynav h2{font-size:32px;font-style:italic;font-weight:500;line-height:1.15}
.daynav h2 .wd{display:block;font-style:normal;font-family:var(--body);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px}
.iconbtn{width:46px;height:46px;flex:none;border-radius:50%;border:0;background:var(--plum-soft);color:var(--plum);font-size:22px;line-height:1;display:grid;place-items:center}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.daynav .tags{justify-content:center}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--plum-soft);color:var(--plum)}
.tag.off{background:var(--off-soft);color:var(--off)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.rose{background:var(--rose-soft);color:var(--rose)}

.card{--c:var(--plum);--cs:var(--plum-soft);background:var(--surface);border-radius:24px;padding:16px 16px 16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);position:relative;border:1.5px solid transparent}
.card[data-cat="poli"]{--c:var(--plum);--cs:var(--plum-soft)}
.card[data-cat="acad"]{--c:var(--sage);--cs:var(--sage-soft)}
.card[data-cat="lect"]{--c:var(--gold);--cs:var(--gold-soft)}
.card[data-cat="evento"]{--c:var(--rose);--cs:var(--rose-soft)}
.card .head{display:flex;gap:12px;align-items:flex-start}
.card .ico{flex:none;width:42px;height:42px;border-radius:14px;background:var(--cs);color:var(--c);display:grid;place-items:center;font-family:var(--display);font-style:italic;font-weight:700;font-size:19px}
.card .head > div{min-width:0}
.card .kind{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.card.done{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.card.missed{border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.card.rest{opacity:.7}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.time{font-variant-numeric:tabular-nums;font-size:14.5px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;font-size:15.5px;font-weight:600;min-height:38px;color:var(--muted)}
.chip[aria-pressed="true"][data-v="Cumplida"]{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip[aria-pressed="true"][data-v="No asistí"],.chip[aria-pressed="true"][data-v="Suspendida"]{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip[aria-pressed="true"][data-v="Licencia"],.chip[aria-pressed="true"][data-v="Feriado"]{background:var(--off-soft);color:var(--off);border-color:transparent}
.stepper{display:flex;align-items:center;gap:6px;background:var(--cs);border-radius:999px;padding:4px}
.stepper button{width:40px;height:40px;border:0;border-radius:50%;background:var(--surface);color:var(--c);font-size:20px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stepper input{width:52px;height:40px;border:0;text-align:center;background:transparent;font-variant-numeric:tabular-nums;font-size:20px;font-family:var(--display);font-weight:600;color:var(--c)}

.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1.5px dashed var(--line)}
.task:last-child{border-bottom:0}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700}
.check[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.task .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.task .desc{font-weight:600}
.task.isdone .desc{text-decoration:line-through;color:var(--muted);font-weight:400}
.seg{display:flex;gap:4px;background:var(--plum-soft);border-radius:999px;padding:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 4px;font-size:14px;font-weight:600;color:var(--plum)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.metric{border-radius:22px;padding:14px 16px;background:var(--plum-soft);color:var(--plum)}
.metric:nth-child(2){background:var(--sage-soft);color:var(--sage)}
.metric:nth-child(3){background:var(--gold-soft);color:var(--gold)}
.metric:nth-child(4){background:var(--rose-soft);color:var(--rose)}
.metric .small{color:inherit;opacity:.85;font-weight:600}
.metric b{display:block;font-family:var(--display);font-weight:600;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:2px}
.tablewrap{overflow-x:auto;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:4px 6px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}
tbody tr:last-child td{border-bottom:0}
tr.total td{font-weight:700;color:var(--plum)}

nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 32px));background:var(--plum-deep);border-radius:999px;display:flex;padding:6px;gap:4px;z-index:5;box-shadow:0 10px 30px rgba(51,39,90,.35)}
nav.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:10px 8px;min-height:50px;color:#C9BDE6;font-size:16.5px;font-weight:700}
nav.tabs button[aria-current="page"]{background:var(--rose);color:var(--on-rose)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:6}
.err{color:var(--bad);font-size:13px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.card,.chip,.check,.seg button,nav.tabs button{transition:background-color .18s,border-color .18s,color .18s}}
</style>
</head>
<body>
<header class="hero">
  <div class="inner">
    <div class="brand"><span class="mark" aria-hidden="true">B</span><div><div class="eyebrow">Residencia · 2.º semestre</div><h1>Bitácora de residencia</h1></div></div>
    <div id="status">Guardado en este dispositivo</div>
  </div>
</header>
<div class="page"><main id="view" class="wrap"></main></div>
<nav class="tabs" aria-label="Secciones">
  <button id="tab-hoy" data-tab="hoy" aria-current="page">Día</button>
  <button id="tab-tareas" data-tab="tareas">Tareas</button>
  <button id="tab-resumen" data-tab="resumen">Resumen</button>
</nav>
<div id="toast" class="toast" hidden></div>

<script src="xlsx.full.min.js"></script>

</html>
<script>
const INICIO="2026-10-01", FIN="2027-03-31";
const DIAS=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const MESL=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MESN=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const AGENDA={
 1:[{h:"09:00–11:00",a:"Poli mama – Sandra"},{h:"13:30–16:00",a:"Poli general – Oviedo"}],
 2:[{h:"08:30–09:30",a:"Ateneo HC"},{h:"09:30–11:00",a:"Clase clínica HC"},{h:"12:30–15:00",a:"Poli QT-general – Ximenez"}],
 3:[{h:"08:30–09:00",a:"Ateneo INCA"},{h:"09:00–13:00",a:"Poli general – Melisa"}],
 4:[{h:"08:00–13:00",a:"Poli uro – Vera"}],
 5:[{h:"08:30–10:00",a:"Pautado HC"},{h:"Variable",a:"Viernes variable",v:true}]
};
const AGENDA_OCT={
 1:[{h:"08:30–11:30",a:"Poli mama – Nantes"},{h:"13:00–14:00",a:"UOC"}],
 2:[{h:"08:30–09:30",a:"Ateneo HC"},{h:"09:30–11:00",a:"Clase clínica HC"},{h:"12:30–15:00",a:"Poli QT-general – Ximenez"}],
 3:[{h:"08:30–09:00",a:"Ateneo INCA"},{h:"10:00–13:00",a:"Poli general – Ximenez"}],
 4:[{h:"09:00–14:00",a:"Poli mama – Sandra"}],
 5:[{h:"08:30–10:00",a:"Pautado HC"},{h:"Variable",a:"Viernes variable",v:true}]
};
const CORTE="2026-10-16";
const ESPECIALES={"2026-10-01":[{h:"08:30–13:30",a:"Jornada de uro-oncología HC"}]};
const VIERNES=["Viernes de papers","Poli dermato","Poli ORL","Sin actividad"];
const POLIS=["Poli mama – Nantes","Poli general – Ximenez","UOC","Poli mama – Sandra","Poli general – Oviedo","Poli QT-general – Ximenez","Poli general – Melisa","Poli uro – Vera","Poli dermato","Poli ORL"];
const ESTADOS=["Cumplida","No asistí","Suspendida","Licencia"];
const TIPOS=["Preparar poli","Control de pacientes","Ateneo","Resultados / llamadas","Gestión (FNR, recetas, formularios)","Interconsulta","Revisión bibliográfica","Docencia","Otro"];
const FERIADOS={"2026-10-12":"Día de la Diversidad Cultural","2026-10-20":"Día del Funcionario de Salud Pública","2026-11-02":"Día de los Difuntos","2026-12-25":"Navidad","2027-01-01":"Año Nuevo","2027-01-04":"Reyes (trasladado)","2027-02-08":"Carnaval","2027-02-09":"Carnaval","2027-03-22":"Turismo","2027-03-23":"Turismo","2027-03-24":"Turismo","2027-03-25":"Turismo","2027-03-26":"Turismo"};
const LICENCIAS=[["2027-01-04","2027-01-08"]];
const MESES=[[2026,10],[2026,11],[2026,12],[2027,1],[2027,2],[2027,3]];

const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromIso=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmtCorta=s=>{if(!s)return"";const d=fromIso(s);return pad(d.getDate())+"/"+pad(d.getMonth()+1)};
const hoyIso=()=>iso(new Date());
const enLicencia=s=>LICENCIAS.some(([a,b])=>s>=a&&s<=b);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let state={tab:"hoy",dia:null,filtro:"pend",confirmDel:null,addErr:"",mes:"all"};
let docs=new Map();
let col=null, dbOk=null;

function diaHabil(s,dir){let d=fromIso(s);do{d.setDate(d.getDate()+dir)}while(d.getDay()===0||d.getDay()===6);return iso(d)}
function diaInicial(){let s=hoyIso();if(s<INICIO)s=INICIO;if(s>FIN)s=FIN;const d=fromIso(s).getDay();if(d===0||d===6)s=s>=FIN?diaHabil(s,-1):diaHabil(s,1);return s}
state.dia=diaInicial();
{const m=hoyIso().slice(0,7);if(MESES.some(([y,mm])=>m===y+"-"+pad(mm)))state.mes=m;}

function slots(s){const wd=fromIso(s).getDay();const ag=ESPECIALES[s]||((s<=CORTE?AGENDA_OCT:AGENDA)[wd])||[];return ag.map((x,k)=>({...x,k,id:"r_"+s+"_"+k}))}
function reg(s,slot){
  const d=docs.get(slot.id)||{};
  const def=enLicencia(s)?"Licencia":(FERIADOS[s]?"Feriado":"");
  const act=slot.v?(d.vari||""):slot.a;
  return {estado:d.estado??def,pac:d.pac??null,obs:d.obs||"",act,vari:d.vari||""};
}
function tareas(){return [...docs.entries()].filter(([k,v])=>v.type==="tarea").map(([k,v])=>({id:k,...v}))}
function vencida(t){return t.estado!=="Cumplida"&&t.estado!=="Cancelada"&&t.vence&&t.vence<hoyIso()}

const KEY="bitacora_residencia_v1";
function cargar(){try{const o=JSON.parse(localStorage.getItem(KEY)||"{}");docs=new Map(Object.entries(o.docs||{}));meta=o.meta||{}}catch(e){docs=new Map();meta={}}}
let meta={};
function guardar(){
  try{localStorage.setItem(KEY,JSON.stringify({v:1,docs:Object.fromEntries(docs),meta}));updStatus()}
  catch(e){toast("No se pudo guardar en el dispositivo");const st=document.getElementById("status");if(st){st.textContent="Error al guardar: hacé un respaldo ya";st.className="warn"}}
}
function diasDesde(iso){if(!iso)return null;return Math.floor((fromIso(hoyIso())-fromIso(iso))/864e5)}
function updStatus(){const st=document.getElementById("status");if(!st)return;
  const d=diasDesde(meta.respaldo);
  if(d===null&&docs.size){st.textContent="Guardado en este dispositivo · todavía no hiciste un respaldo";st.className="warn"}
  else if(d!==null&&d>14){st.textContent="Guardado en este dispositivo · último respaldo hace "+d+" días";st.className="warn"}
  else{st.textContent="Guardado en este dispositivo"+(d!==null?" · respaldo "+fmtCorta(meta.respaldo):"");st.className=""}}
const timers={};
function writeDoc(id,patch,delay=0){
  docs.set(id,{...(docs.get(id)||{}),...patch});
  render();
  clearTimeout(timers[id]);
  timers[id]=setTimeout(()=>{timers[id]=null;guardar()},delay);
}
function deleteDoc(id){clearTimeout(timers[id]);docs.delete(id);guardar();render()}
async function entregar(nombre,blob){
  try{
    const f=new File([blob],nombre,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[f]})&&/iphone|ipad|android/i.test(navigator.userAgent)){await navigator.share({files:[f],title:nombre});return true}
  }catch(e){if(e&&e.name==="AbortError")return false}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return true;
}
async function respaldo(){
  const blob=new Blob([JSON.stringify({app:"bitacora-residencia",v:1,fecha:hoyIso(),docs:Object.fromEntries(docs)},null,1)],{type:"application/json"});
  if(await entregar("Bitacora_respaldo_"+hoyIso()+".json",blob)){meta.respaldo=hoyIso();guardar();render();toast("Respaldo generado")}
}
function restaurar(file){
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(o.app!=="bitacora-residencia"||!o.docs)throw 0;
      docs=new Map(Object.entries(o.docs));guardar();state.confirmRestore=false;render();toast("Respaldo restaurado ("+fmtCorta(o.fecha)+")")}
    catch(e){toast("Ese archivo no es un respaldo de la bitácora")}};
  r.readAsText(file);
}

let tt;function toast(m){const el=document.getElementById("toast");el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2600)}

function cat(a){a=a||"";if(a.startsWith("Poli")||a==="UOC")return["poli","Policlínica","P"];if(/^(Ateneo|Clase)/.test(a))return["acad","Ateneo y docencia","A"];if(/Pautado|papers/i.test(a))return["lect","Pautas y lectura","L"];if(/Jornada/.test(a))return["evento","Jornada","J"];return["otro","Actividad","·"]}
function viewHoy(){
  const s=state.dia,d=fromIso(s),wd=d.getDay();
  const fer=FERIADOS[s],lic=enLicencia(s);
  const fuera=s<INICIO||s>FIN;
  let h=`<div class="wrap" style="gap:14px">
  <div class="daynav">
    <button class="iconbtn" id="prev" aria-label="Día hábil anterior">‹</button>
    <div class="d"><h2><span class="wd">${DIAS[wd]}</span>${d.getDate()} de ${MESL[d.getMonth()]}</h2>
      <div class="tags">${s===hoyIso()?'<span class="tag">Hoy</span>':''}${fer?`<span class="tag off">Feriado · ${esc(fer)}</span>`:''}${lic?'<span class="tag off">Licencia</span>':''}</div></div>
    <button class="iconbtn" id="next" aria-label="Día hábil siguiente">›</button>
  </div>
  <div class="row"><input type="date" id="pick" class="field" style="flex:1;min-width:0" value="${s}" min="${INICIO}" max="${FIN}" aria-label="Ir a fecha">${s!==hoyIso()?'<button class="btn" id="gohoy">Hoy</button>':''}</div>`;
  if(fuera) h+=`<div class="banner off">Esta fecha está fuera del semestre (1/10/2026 – 31/3/2027).</div>`;
  for(const sl of slots(s)){
    const r=reg(s,sl);
    const cls=r.estado==="Cumplida"?"done":(r.estado==="No asistí"||r.estado==="Suspendida")?"missed":(r.estado==="Licencia"||r.estado==="Feriado")?"rest":"";
    const esPoli=(r.act||"").startsWith("Poli")||r.act==="UOC";
    const [ck,cl,ci]=cat(sl.v?r.act:sl.a);
    h+=`<section class="card ${cls}" data-cat="${ck}" aria-label="${esc(sl.v?"Actividad del viernes":sl.a)}">
      <div class="head"><span class="ico" aria-hidden="true">${ci}</span><div><div class="kind">${cl} · <span class="time">${sl.h}</span></div><h3>${esc(sl.v?(r.act||"Viernes sin definir"):sl.a)}</h3></div></div>`;
    if(sl.v) h+=`<select class="field" id="vari-${sl.id}" data-vari="${sl.id}" aria-label="Actividad del viernes"><option value="">Elegí la actividad</option>${VIERNES.map(o=>`<option ${o===r.vari?"selected":""}>${o}</option>`).join("")}</select>`;
    h+=`<div class="chips" role="group" aria-label="Estado">${ESTADOS.map(e=>`<button class="chip" data-est="${sl.id}" data-v="${e}" aria-pressed="${r.estado===e}">${e}</button>`).join("")}${r.estado==="Feriado"?'<span class="chip" data-v="Feriado" aria-pressed="true">Feriado</span>':''}</div>`;
    if(esPoli) h+=`<div class="row"><span class="small muted" style="flex:1">Pacientes vistos</span>
      <div class="stepper"><button data-step="${sl.id}" data-d="-1" aria-label="Restar paciente">−</button><input id="pac-${sl.id}" data-pac="${sl.id}" inputmode="numeric" value="${r.pac??""}" placeholder="0" aria-label="Pacientes vistos"><button data-step="${sl.id}" data-d="1" aria-label="Sumar paciente">+</button></div></div>`;
    h+=`<textarea class="field" id="obs-${sl.id}" data-obs="${sl.id}" rows="1" placeholder="Observaciones" aria-label="Observaciones">${esc(r.obs)}</textarea></section>`;
  }
  const delDia=tareas().filter(t=>t.fecha===s||(t.vence===s&&t.estado!=="Cumplida"));
  h+=`<section class="card" data-cat="evento"><div class="row"><h3 style="flex:1">Tareas del día</h3><button class="btn" id="addhoy">Agregar</button></div>
     ${delDia.length?delDia.map(taskRow).join(""):'<div class="small muted">Nada cargado para este día. Las tareas que crees o que venzan hoy aparecen acá.</div>'}</section></div>`;
  return h;
}

function taskRow(t){
  const done=t.estado==="Cumplida",v=vencida(t);
  const del=state.confirmDel===t.id;
  return `<div class="task ${done?"isdone":""}">
   <button class="check" role="checkbox" aria-checked="${done}" data-done="${t.id}" aria-label="Marcar como cumplida">${done?"✓":""}</button>
   <div class="txt"><div class="desc">${esc(t.desc||t.tipo)}</div>
     <div class="tags"><span class="tag">${esc(t.tipo)}</span>${t.pac?`<span class="tag off">${esc(t.pac)}</span>`:''}${t.cant?`<span class="tag off">${t.cant} pac.</span>`:''}${t.vence?`<span class="tag ${v?"bad":"off"}">${v?"Vencida ":"Vence "}${fmtCorta(t.vence)}</span>`:''}${done&&t.hecho?`<span class="tag off">Hecha ${fmtCorta(t.hecho)}</span>`:''}</div></div>
   ${del?`<button class="btn" data-delok="${t.id}" style="color:var(--bad)">Borrar</button><button class="btn ghost" data-delno="1">No</button>`:`<button class="btn ghost" data-del="${t.id}" aria-label="Borrar tarea">✕</button>`}
  </div>`;
}

function viewTareas(){
  const all=tareas().sort((a,b)=>(a.vence||"9999").localeCompare(b.vence||"9999")||(b.fecha||"").localeCompare(a.fecha||""));
  const f=state.filtro;
  const list=all.filter(t=>f==="todas"?true:f==="hechas"?t.estado==="Cumplida":(t.estado!=="Cumplida"&&t.estado!=="Cancelada"));
  return `<div class="wrap" style="gap:14px">
  <section class="card" aria-label="Nueva tarea"><h2>Nueva tarea</h2>
   <div class="grid2"><label class="small muted">Fecha<input type="date" id="t-fecha" class="field" value="${state.dia}"></label>
   <label class="small muted">Vence<input type="date" id="t-vence" class="field"></label></div>
   <select id="t-tipo" class="field" aria-label="Tipo">${TIPOS.map(t=>`<option>${t}</option>`).join("")}</select>
   <input id="t-desc" class="field" placeholder="Revisar pacientes de poli QT del martes" aria-label="Descripción">
   <div class="grid2"><input id="t-pac" class="field" placeholder="Iniciales / registro" aria-label="Paciente"><input id="t-cant" class="field" inputmode="numeric" placeholder="Cantidad" aria-label="Cantidad de pacientes"></div>
   ${state.addErr?`<div class="err">${esc(state.addErr)}</div>`:""}
   <button class="btn primary" id="t-add">Agregar tarea</button>
   <div class="small muted">Para pacientes, solo iniciales o número de registro.</div>
  </section>
  <div class="seg" role="group" aria-label="Filtro">${[["pend","Pendientes"],["hechas","Cumplidas"],["todas","Todas"]].map(([k,l])=>`<button data-filtro="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}</div>
  <section class="card">${list.length?list.map(taskRow).join(""):`<div class="small muted">${f==="pend"?"No tenés tareas pendientes.":"Todavía no hay tareas en esta vista."}</div>`}</section></div>`;
}

function iterRegistros(cb){
  let d=fromIso(INICIO);const end=fromIso(FIN);
  while(d<=end){const s=iso(d);if(d.getDay()>0&&d.getDay()<6)for(const sl of slots(s))cb(s,sl,reg(s,sl));d.setDate(d.getDate()+1)}
}
function enMes(s,mes){return mes==="all"||(s||"").startsWith(mes)}
function nombreMes(mes){if(mes==="all")return "Semestre completo";const [y,m]=mes.split("-").map(Number);return ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"][m-1]+" "+y}
function stats(mes){
  let pac=0,ok=0,no=0,lic=0;const tab={};POLIS.forEach(p=>tab[p]=MESES.map(()=>0));
  iterRegistros((s,sl,r)=>{
    if(!enMes(s,mes))return;
    if(r.estado==="Cumplida")ok++;if(r.estado==="No asistí"||r.estado==="Suspendida")no++;if(r.estado==="Licencia"||r.estado==="Feriado")lic++;
    if(r.pac){pac+=r.pac;const mi=MESES.findIndex(([y,m])=>s.startsWith(y+"-"+pad(m)));if(tab[r.act]&&mi>=0)tab[r.act][mi]+=r.pac}
  });
  const ts=tareas().filter(t=>enMes(t.fecha,mes));
  const porTipo=TIPOS.map(t=>{const x=ts.filter(y=>y.tipo===t);return {tipo:t,n:x.length,ok:x.filter(y=>y.estado==="Cumplida").length,pac:x.reduce((a,y)=>a+(Number(y.cant)||0),0)}});
  const cols=mes==="all"?MESES.map((_,i)=>i):[MESES.findIndex(([y,m])=>mes===y+"-"+pad(m))];
  return {pac,ok,no,lic,asist:ok+no?Math.round(ok/(ok+no)*1000)/10:null,ts,hechas:ts.filter(t=>t.estado==="Cumplida").length,venc:ts.filter(vencida).length,pend:ts.filter(t=>t.estado!=="Cumplida"&&t.estado!=="Cancelada").length,tab,cols,porTipo};
}
function viewResumen(){
  const mes=state.mes,st=stats(mes);
  const opts=[["all","Semestre completo"],...MESES.map(([y,m])=>[y+"-"+pad(m),nombreMes(y+"-"+pad(m))])];
  const tot=st.cols.map(i=>POLIS.reduce((a,p)=>a+st.tab[p][i],0));
  return `<div class="wrap" style="gap:14px">
   <select id="mes" class="field" aria-label="Período">${opts.map(([k,l])=>`<option value="${k}" ${k===mes?"selected":""}>${l}</option>`).join("")}</select>
   <div class="grid2">
    <div class="metric"><span class="small muted">Pacientes vistos</span><b>${st.pac}</b></div>
    <div class="metric"><span class="small muted">Asistencia</span><b>${st.asist===null?"—":st.asist.toFixed(1)+"%"}</b><span class="small muted">${st.ok} cumplidas · ${st.no} no</span></div>
    <div class="metric"><span class="small muted">Tareas cumplidas</span><b>${st.hechas}/${st.ts.length}</b></div>
    <div class="metric"><span class="small muted">Tareas vencidas</span><b>${st.venc}</b></div>
   </div>
   <h2>Pacientes por policlínica</h2>
   <div class="tablewrap"><table><thead><tr><th>Policlínica</th>${st.cols.map(i=>`<th>${MESN[MESES[i][1]-1]} ${String(MESES[i][0]).slice(2)}</th>`).join("")}${st.cols.length>1?"<th>Total</th>":""}</tr></thead><tbody>
    ${POLIS.map(p=>`<tr><td>${esc(p)}</td>${st.cols.map(i=>`<td>${st.tab[p][i]||"·"}</td>`).join("")}${st.cols.length>1?`<td><b>${st.cols.reduce((a,i)=>a+st.tab[p][i],0)}</b></td>`:""}</tr>`).join("")}
    <tr class="total"><td>Total</td>${tot.map(n=>`<td>${n}</td>`).join("")}${st.cols.length>1?`<td>${tot.reduce((a,b)=>a+b,0)}</td>`:""}</tr></tbody></table></div>
   <h2>Tareas por tipo</h2>
   <div class="tablewrap"><table><thead><tr><th>Tipo</th><th>Total</th><th>Cumplidas</th><th>Pac.</th></tr></thead><tbody>
    ${st.porTipo.map(x=>`<tr><td>${esc(x.tipo)}</td><td>${x.n}</td><td>${x.ok}</td><td>${x.pac}</td></tr>`).join("")}</tbody></table></div>
   <button class="btn primary" id="export" ${window.XLSX?"":"disabled"}>Descargar Excel · ${esc(nombreMes(mes))}</button>
   <div class="small muted">El archivo trae tres hojas: Resumen, Registro diario y Tareas extra del período elegido.</div>
   <section class="card" aria-label="Respaldo">
    <h2>Respaldo</h2>
    <div class="small muted">Los datos viven solo en este dispositivo. Hacé un respaldo cada semana y guardalo en Drive: sirve para recuperar todo si cambiás o perdés el celular.</div>
    <div class="small">${meta.respaldo?"Último respaldo: "+fmtCorta(meta.respaldo):"Todavía no hiciste ningún respaldo."}</div>
    <button class="btn" id="bk">Descargar respaldo</button>
    ${state.confirmRestore?`<div class="banner warn">Restaurar reemplaza todo lo cargado en este dispositivo por el contenido del archivo.</div>
      <label class="btn" style="text-align:center">Elegir archivo de respaldo<input type="file" id="rs-file" accept=".json,application/json" hidden></label>
      <button class="btn ghost" id="rs-no">Cancelar</button>`:'<button class="btn ghost" id="rs">Restaurar desde un respaldo</button>'}
   </section>
  </div>`;
}

function render(){
  const ae=document.activeElement,aid=ae&&ae.id,sel=aid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;
  const v=document.getElementById("view");
  v.innerHTML=state.tab==="hoy"?viewHoy():state.tab==="tareas"?viewTareas():viewResumen();
  if(aid){const el=document.getElementById(aid);if(el){el.focus();if(sel&&el.setSelectionRange)try{el.setSelectionRange(...sel)}catch(e){}}}
  document.querySelectorAll("nav.tabs button").forEach(b=>b.dataset.tab===state.tab?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.tab){state.tab=t.dataset.tab;state.confirmDel=null;render();window.scrollTo(0,0);return}
  if(t.id==="prev"){state.dia=diaHabil(state.dia,-1);render();return}
  if(t.id==="next"){state.dia=diaHabil(state.dia,1);render();return}
  if(t.id==="gohoy"){state.dia=hoyIso();render();return}
  if(t.dataset.est){const id=t.dataset.est,cur=docs.get(id)?.estado;writeDoc(id,{type:"reg",fecha:id.slice(2,12),estado:cur===t.dataset.v?"":t.dataset.v});return}
  if(t.dataset.step){const id=t.dataset.step,s=id.slice(2,12),sl=slots(s).find(x=>x.id===id),r=reg(s,sl);const n=Math.max(0,(r.pac||0)+Number(t.dataset.d));writeDoc(id,{type:"reg",fecha:s,pac:n},700);return}
  if(t.dataset.done){const id=t.dataset.done,cur=docs.get(id);const done=cur.estado==="Cumplida";writeDoc(id,{estado:done?"Pendiente":"Cumplida",hecho:done?"":hoyIso()});return}
  if(t.dataset.del){state.confirmDel=t.dataset.del;render();return}
  if(t.dataset.delno){state.confirmDel=null;render();return}
  if(t.dataset.delok){state.confirmDel=null;deleteDoc(t.dataset.delok);toast("Tarea borrada");return}
  if(t.dataset.filtro){state.filtro=t.dataset.filtro;render();return}
  if(t.id==="addhoy"){state.tab="tareas";render();document.getElementById("t-desc")?.focus();return}
  if(t.id==="t-add"){addTask();return}
  if(t.id==="export"){exportar();return}
  if(t.id==="bk"){respaldo();return}
  if(t.id==="rs"){state.confirmRestore=true;render();return}
  if(t.id==="rs-no"){state.confirmRestore=false;render();return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="mes"){state.mes=t.value;render();return}
  if(t.id==="rs-file"&&t.files&&t.files[0]){restaurar(t.files[0]);return}
  if(t.id==="pick"&&t.value){let s=t.value;const wd=fromIso(s).getDay();if(wd===0||wd===6)s=diaHabil(s,1);state.dia=s;render();return}
  if(t.dataset.vari){const id=t.dataset.vari;writeDoc(id,{type:"reg",fecha:id.slice(2,12),vari:t.value});return}
  if(t.dataset.obs){const id=t.dataset.obs;if((docs.get(id)?.obs||"")!==t.value)writeDoc(id,{type:"reg",fecha:id.slice(2,12),obs:t.value});return}
  if(t.dataset.pac){const id=t.dataset.pac;const n=t.value.trim()===""?null:Math.max(0,parseInt(t.value,10)||0);writeDoc(id,{type:"reg",fecha:id.slice(2,12),pac:n});return}
});
document.addEventListener("input",e=>{if(e.target.id&&e.target.id.startsWith("t-")&&state.addErr){state.addErr="";const el=document.querySelector(".err");if(el)el.remove()}});

function addTask(){
  const g=id=>document.getElementById(id).value.trim();
  const desc=g("t-desc"),fecha=g("t-fecha");
  if(!desc){state.addErr="Escribí una descripción.";render();document.getElementById("t-desc").focus();return}
  if(!fecha){state.addErr="Elegí la fecha.";render();return}
  const cant=g("t-cant")===""?null:Math.max(0,parseInt(g("t-cant"),10)||0);
  const id="t_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  state.addErr="";
  writeDoc(id,{type:"tarea",fecha,tipo:g("t-tipo"),desc,pac:g("t-pac"),cant,vence:g("t-vence"),estado:"Pendiente",hecho:"",creada:Date.now()});
  ["t-desc","t-pac","t-cant","t-vence"].forEach(i=>{const el=document.getElementById(i);if(el)el.value=""});
  toast("Tarea agregada");
}

const xd=s=>s?{t:"n",v:(Date.UTC(...s.split("-").map((x,i)=>i===1?x-1:+x))-Date.UTC(1899,11,30))/864e5,z:"dd/mm/yyyy"}:"";
async function exportar(){
  const mes=state.mes,st=stats(mes);
  const rs=[["Bitácora de residencia — "+nombreMes(mes)],["Generado",xd(hoyIso())],[],
    ["Indicador","Valor"],["Pacientes vistos",st.pac],["Actividades cumplidas",st.ok],["No asistidas / suspendidas",st.no],["Feriados / licencia",st.lic],
    ["% asistencia (excluye feriados y licencias)",st.asist===null?"":st.asist/100],
    ["Tareas registradas",st.ts.length],["Tareas cumplidas",st.hechas],["Tareas pendientes",st.pend],["Tareas vencidas",st.venc],[],
    ["Pacientes por policlínica",...st.cols.map(i=>MESN[MESES[i][1]-1]+" "+MESES[i][0]),...(st.cols.length>1?["Total"]:[])]];
  POLIS.forEach(p=>rs.push([p,...st.cols.map(i=>st.tab[p][i]),...(st.cols.length>1?[st.cols.reduce((a,i)=>a+st.tab[p][i],0)]:[])]));
  rs.push(["Total",...st.cols.map(i=>POLIS.reduce((a,p)=>a+st.tab[p][i],0)),...(st.cols.length>1?[st.pac]:[])]);
  rs.push([],["Tareas por tipo","Registradas","Cumplidas","Pacientes"]);
  st.porTipo.forEach(x=>rs.push([x.tipo,x.n,x.ok,x.pac]));
  const regs=[["Fecha","Día","Horario","Actividad","Estado","Pacientes vistos","Observaciones","Feriado"]];
  iterRegistros((s,sl,r)=>{if(enMes(s,mes))regs.push([xd(s),DIAS[fromIso(s).getDay()],sl.h,sl.v?(r.act||"Viernes variable"):sl.a,r.estado,r.pac??"",r.obs,FERIADOS[s]||""])});
  const tk=[["Fecha","Tipo","Descripción","Paciente","Cantidad","Vence","Estado","Fecha cumplida"]];
  st.ts.sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")).forEach(t=>tk.push([xd(t.fecha),t.tipo,t.desc,t.pac||"",t.cant??"",xd(t.vence),t.estado,xd(t.hecho)]));
  const wb=XLSX.utils.book_new();
  const w0=XLSX.utils.aoa_to_sheet(rs,{cellDates:true,dateNF:"dd/mm/yyyy"});w0["!cols"]=[{wch:42},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10}];
  if(w0["B9"]&&typeof w0["B9"].v==="number")w0["B9"].z="0.0%";
  const w1=XLSX.utils.aoa_to_sheet(regs,{cellDates:true,dateNF:"dd/mm/yyyy"});w1["!cols"]=[{wch:11},{wch:10},{wch:13},{wch:28},{wch:11},{wch:9},{wch:40},{wch:24}];
  const w2=XLSX.utils.aoa_to_sheet(tk,{cellDates:true,dateNF:"dd/mm/yyyy"});w2["!cols"]=[{wch:11},{wch:26},{wch:40},{wch:18},{wch:9},{wch:11},{wch:11},{wch:13}];
  XLSX.utils.book_append_sheet(wb,w0,"Resumen");XLSX.utils.book_append_sheet(wb,w1,"Registro diario");XLSX.utils.book_append_sheet(wb,w2,"Tareas extra");
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  const nom=mes==="all"?"semestre":mes;
  await entregar("Bitacora_residencia_"+nom+".xlsx",new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
}

cargar();render();updStatus();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
