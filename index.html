<style>
@font-face{font-family:"Outfit";src:url(fonts/outfit.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Jakarta";src:url(fonts/jakarta.woff2) format("woff2");font-weight:200 800;font-style:normal;font-display:swap}
/* Layout: tarjetas blancas flotantes sobre un fondo luminoso con resplandores suaves; títulos en Outfit (redondeada),
   texto en Plus Jakarta Sans; categoría como etiqueta pastel, controles en cápsulas y barra inferior flotante */
:root{
  --bg:#F4F9F9; --surface:#FFFFFF; --tint:#EDF4F5; --ink:#12262B; --muted:#587078; --line:#E4EEEF;
  --teal:#08727A; --teal-soft:#DFF3F3; --on-teal:#FFFFFF;
  --indigo:#4F54D4; --indigo-soft:#EAEBFC;
  --ochre:#94590A; --ochre-soft:#FFF0D3;
  --clay:#B93626; --clay-soft:#FFE7E2; --on-clay:#FFFFFF;
  --ok:#16723D; --ok-soft:#DAF5E6; --bad:#BC2F49; --bad-soft:#FFE2E8; --off:#5D7078; --off-soft:#EAF1F2;
  --warn:#8A5A08; --warn-soft:#FFF1D2;
  --glow1:rgba(80,208,205,.30); --glow2:rgba(150,138,255,.24);
  --shadow:0 1px 2px rgba(18,70,80,.04),0 8px 28px rgba(18,70,80,.08);
  --nav-bg:rgba(255,255,255,.86);
  --display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Jakarta",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B1416; --surface:#131F22; --tint:#1A292D; --ink:#E9F2F1; --muted:#9DB2B3; --line:#22343A;
  --teal:#62D0D2; --teal-soft:#12383B; --on-teal:#05191B;
  --indigo:#A3A8FA; --indigo-soft:#23264F;
  --ochre:#EDBE6A; --ochre-soft:#3A2E15;
  --clay:#FF9985; --clay-soft:#43211C; --on-clay:#2B0E09;
  --ok:#7ADBA3; --ok-soft:#153227; --bad:#FF9FB0; --bad-soft:#3F1E27; --off:#A3B5B8; --off-soft:#1E2B2E;
  --warn:#F0C474; --warn-soft:#3A2D12;
  --glow1:rgba(60,170,170,.20); --glow2:rgba(120,110,230,.18);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  --nav-bg:rgba(19,31,34,.88);
  color-scheme:dark}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(560px 340px at 6% -60px,var(--glow1),transparent 72%),radial-gradient(560px 360px at 104% -30px,var(--glow2),transparent 72%),var(--bg);background-repeat:no-repeat;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{width:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
.wrap>*{min-width:0}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.015em;line-height:1.2}
h2{font-size:23px}
h3{font-size:22px}
.muted{color:var(--muted)}
.small{font-size:14.5px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--clay);outline-offset:2px}
svg{display:block}
.sec{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.sec h2{flex:1}
.sec .small{color:var(--muted)}

.top{padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 14px max(20px,env(safe-area-inset-left,0px))}
.top .inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top .mark{flex:none;width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#2BB8B5,#6A63F0);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;box-shadow:0 6px 16px rgba(80,120,230,.30)}
.top .ttl{flex:1;min-width:0}
.top .eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.top h1{font-size:21px;font-weight:700;line-height:1.1}
#status{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:6px 12px;max-width:55%;line-height:1.25;white-space:nowrap;display:flex;align-items:center;gap:7px}
#status::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok)}
#status.warn{color:var(--warn);background:var(--warn-soft)}
#status.warn::before{background:var(--warn)}

.btn{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:10px 18px;min-height:48px;font-weight:700}
.btn.primary{background:linear-gradient(135deg,#08727A,#3C57C9);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{background:linear-gradient(135deg,#62D0D2,#8E96F5);color:#06191B}}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn:disabled{opacity:.5}
.field{width:100%;border:1.5px solid transparent;background:var(--tint);border-radius:16px;padding:10px 14px;min-height:48px}
.field::placeholder{color:var(--muted);opacity:.8}
.field:focus{border-color:var(--teal);outline:none;background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 16%,transparent)}
textarea.field{min-height:50px;resize:none;line-height:1.45;overflow:hidden}
select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
label.small{display:flex;flex-direction:column;gap:4px}
.banner{border-radius:16px;padding:12px 14px;font-size:14px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.off{background:var(--off-soft);color:var(--off)}

.daynav{display:flex;align-items:center;gap:8px;margin-top:4px}
.daynav .d{flex:1;min-width:0;text-align:center}
.daynav h2{font-size:36px;font-weight:600;line-height:1.08;letter-spacing:-.025em}
.daynav h2 .wd{display:block;font-family:var(--body);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);font-weight:800;margin-bottom:3px}
.iconbtn{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);color:var(--teal);font-size:22px;line-height:1;display:grid;place-items:center;padding:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.daynav .tags{justify-content:center}
.tag{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--teal-soft);color:var(--teal)}
.tag.off{background:var(--off-soft);color:var(--off)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.clay{background:var(--clay-soft);color:var(--clay)}

.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--surface);box-shadow:var(--shadow);border-radius:22px;padding:6px}
.week button{border:0;background:transparent;border-radius:17px;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted)}
.week .wl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.week .wn{font-family:var(--display);font-size:22px;font-weight:600;color:var(--ink);line-height:1.15;font-variant-numeric:tabular-nums}
.week .dot{width:6px;height:6px;border-radius:50%;border:1.5px solid transparent}
.week .dot.full{background:var(--ok);border-color:var(--ok)}
.week .dot.part{border-color:var(--ok)}
.week button[aria-current="date"]{background:linear-gradient(160deg,#0C7F87,#3F5BCB);color:#fff;box-shadow:0 6px 14px rgba(40,100,200,.28)}
@media (prefers-color-scheme:dark){.week button[aria-current="date"]{background:linear-gradient(160deg,#62D0D2,#8E96F5);color:#06191B}.week button[aria-current="date"] .wn{color:#06191B}}
.week button[aria-current="date"] .wn{color:#fff}
.week button[aria-current="date"] .dot.full{background:currentColor;border-color:currentColor}
.week button[aria-current="date"] .dot.part{border-color:currentColor}
.week button.hoy:not([aria-current="date"]) .wn{color:var(--clay)}
.gorow{display:flex;gap:8px;align-items:center}

.card{--c:var(--teal);--cs:var(--teal-soft);background:var(--surface);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);position:relative}
.card[data-cat="poli"]{--c:var(--teal);--cs:var(--teal-soft)}
.card[data-cat="acad"]{--c:var(--indigo);--cs:var(--indigo-soft)}
.card[data-cat="lect"]{--c:var(--ochre);--cs:var(--ochre-soft)}
.card[data-cat="evento"]{--c:var(--clay);--cs:var(--clay-soft)}
.card[data-cat="otro"]{--c:var(--off);--cs:var(--off-soft)}
.card .body{display:flex;flex-direction:column;gap:14px;min-width:0}
.card .kind{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.card .cat{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c);background:var(--cs);padding:4px 11px;border-radius:999px}
.card .time{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;font-size:13.5px}
.card.done{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--ok) 30%,transparent),var(--shadow)}
.card.missed{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--bad) 30%,transparent),var(--shadow)}
.card.rest{opacity:.72}
.card.plain{gap:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--tint);border-radius:16px;padding:4px}
.chip{border:0;background:transparent;border-radius:12px;padding:9px 1px;font-size:13px;font-weight:700;min-height:42px;color:var(--muted);line-height:1.15}
.chip[aria-pressed="true"][data-v="Cumplida"]{background:var(--ok-soft);color:var(--ok);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ok) 45%,transparent)}
.chip[aria-pressed="true"][data-v="No asistí"],.chip[aria-pressed="true"][data-v="Suspendida"]{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--bad) 45%,transparent)}
.chip[aria-pressed="true"][data-v="Licencia"]{background:var(--surface);color:var(--off);box-shadow:var(--shadow)}
@media (max-width:350px){.seg4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stepper{display:flex;align-items:center;gap:4px;background:var(--cs);border-radius:18px;padding:4px}
.stepper button{width:42px;height:42px;border:0;border-radius:14px;background:var(--surface);color:var(--c);font-size:22px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.stepper input{width:54px;height:42px;border:0;text-align:center;background:transparent;font-variant-numeric:tabular-nums;font-size:22px;font-family:var(--display);font-weight:600;color:var(--c)}
.obslbl{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;margin-bottom:-8px}

.presbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--clay-soft);color:var(--clay);border-radius:16px;padding:10px 16px;min-height:50px;font-weight:800;text-align:left}
.presbtn svg{flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.presbtn[aria-pressed="true"]{background:linear-gradient(135deg,#CC4530,#C73A58);color:#fff;box-shadow:0 8px 18px rgba(210,70,80,.28)}
@media (prefers-color-scheme:dark){.presbtn[aria-pressed="true"]{background:linear-gradient(135deg,#FFA38F,#F58AA5);color:#2B0E09;box-shadow:none}}
.presbtn[aria-pressed="true"] svg{fill:currentColor}

.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1.5px solid var(--line)}
.task:first-of-type{padding-top:4px}
.task:last-child{border-bottom:0;padding-bottom:0}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);background:var(--surface);display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700;padding:0}
.check[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.check svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.task .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.task .desc{font-weight:700}
.task.isdone .desc{text-decoration:line-through;color:var(--muted);font-weight:500}
.seg{display:flex;gap:4px;background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:5px}
.seg button{flex:1;border:0;background:transparent;border-radius:14px;padding:10px 4px;font-size:14.5px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--teal-soft);color:var(--teal)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.metric{border-radius:24px;padding:16px 16px 14px;background:var(--teal-soft);color:var(--teal)}
.metric.indigo{background:var(--indigo-soft);color:var(--indigo)}
.metric.clay{background:var(--clay-soft);color:var(--clay)}
.metric.ochre{background:var(--ochre-soft);color:var(--ochre)}
.metric.ok{background:var(--ok-soft);color:var(--ok)}
.metric.off{background:var(--off-soft);color:var(--off)}
.metric .lbl{display:block;font-size:13.5px;font-weight:700;color:inherit}
.metric .sub{display:block;font-size:12.5px;font-weight:600;color:inherit;opacity:.92;line-height:1.3}
.metric b{display:block;font-family:var(--display);font-weight:600;font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums;margin:3px 0;letter-spacing:-.02em}
.tablewrap{overflow-x:auto;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:6px 8px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;text-align:right;border-bottom:1.5px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td:first-child{white-space:normal;min-width:112px}
th{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.04em;text-transform:uppercase}
tbody tr:last-child td{border-bottom:0}
tr.total td{font-weight:800;color:var(--teal)}
.list{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:6px 18px}
.list h4{margin:14px 0 2px;font-family:var(--display);font-size:17px;font-weight:600;color:var(--teal);text-transform:capitalize}
.li{padding:11px 0;border-bottom:1.5px solid var(--line)}
.li:last-child{border-bottom:0}
.li .meta{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.li .meta b{color:var(--ink)}
.li .meta .clayt{color:var(--clay)}
.li .txt{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:1px}
.li .txt.pres{font-weight:700}

nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100% - 32px));background:var(--nav-bg);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-radius:28px;display:flex;gap:4px;padding:6px;z-index:5;box-shadow:0 12px 36px rgba(18,70,80,.18),0 1px 2px rgba(18,70,80,.08)}
nav.tabs button{flex:1;border:0;background:transparent;border-radius:22px;padding:7px 8px;min-height:54px;color:var(--muted);font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{background:var(--teal-soft);color:var(--teal)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:16px;font-size:14px;font-weight:600;z-index:6}
.err{color:var(--bad);font-size:13px;font-weight:700}
@media (prefers-reduced-motion:no-preference){.card,.chip,.check,.seg button,.presbtn,nav.tabs button,.week button,.btn{transition:background-color .18s,box-shadow .18s,color .18s}}
</style>
</head>

// Actividades donde puedo marcar "presenté yo"; entran como variable en la estadística
const PRESENTABLES=["Ateneo INCA","Clase clínica HC","UMI"];
const ESTADOS=["Cumplida","No asistí","Suspendida","Licencia"];
const TIPOS=["Preparar poli","Control de pacientes","Ateneo","Resultados / llamadas","Gestión (FNR, recetas, formularios)","Interconsulta","Revisión bibliográfica","Docencia","Otro"];
const FERIADOS={"2026-10-12":"Día de la Diversidad Cultural","2026-10-20":"Día del Funcionario de Salud Pública","2026-11-02":"Día de los Difuntos","2026-12-25":"Navidad","2027-01-01":"Año Nuevo","2027-01-04":"Reyes (trasladado)","2027-02-08":"Carnaval","2027-02-09":"Carnaval","2027-03-22":"Turismo","2027-03-23":"Turismo","2027-03-24":"Turismo","2027-03-25":"Turismo","2027-03-26":"Turismo"};
const LICENCIAS=[["2027-01-04","2027-01-08"]];
const MESES=[[2026,10],[2026,11],[2026,12],[2027,1],[2027,2],[2027,3]];

const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromIso=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmtCorta=s=>{if(!s)return"";const d=fromIso(s);return pad(d.getDate())+"/"+pad(d.getMonth()+1)};
const hoyIso=()=>iso(new Date());
const enLicencia=s=>LICENCIAS.some(([a,b])=>s>=a&&s<=b);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let state={tab:"hoy",dia:null,filtro:"pend",confirmDel:null,addErr:"",mes:"all"};
let docs=new Map();

function diaHabil(s,dir){let d=fromIso(s);do{d.setDate(d.getDate()+dir)}while(d.getDay()===0||d.getDay()===6);return iso(d)}
function diaInicial(){let s=hoyIso();if(s<INICIO)s=INICIO;if(s>FIN)s=FIN;const d=fromIso(s).getDay();if(d===0||d===6)s=s>=FIN?diaHabil(s,-1):diaHabil(s,1);return s}
state.dia=diaInicial();
{const m=hoyIso().slice(0,7);if(MESES.some(([y,mm])=>m===y+"-"+pad(mm)))state.mes=m;}

function slots(s){const wd=fromIso(s).getDay();let ag=ESPECIALES[s]||((s<=CORTE?AGENDA_OCT:AGENDA)[wd])||[];if(wd===4)ag=[...ag,UMI];return ag.map((x,k)=>({...x,k,id:"r_"+s+"_"+k}))}
function reg(s,slot){
  const d=docs.get(slot.id)||{};
  const def=enLicencia(s)?"Licencia":(FERIADOS[s]?"Feriado":"");
  const act=slot.v?(d.vari||""):slot.a;
  return {estado:d.estado??def,pac:d.pac??null,obs:d.obs||"",act,vari:d.vari||"",pres:!!d.pres,tema:d.tema||""};
}
function tareas(){return [...docs.entries()].filter(([k,v])=>v.type==="tarea").map(([k,v])=>({id:k,...v}))}
function vencida(t){return t.estado!=="Cumplida"&&t.estado!=="Cancelada"&&t.vence&&t.vence<hoyIso()}

const KEY="bitacora_residencia_v1";
let meta={};
function cargar(){try{const o=JSON.parse(localStorage.getItem(KEY)||"{}");docs=new Map(Object.entries(o.docs||{}));meta=o.meta||{}}catch(e){docs=new Map();meta={}}}
function guardar(){
  try{localStorage.setItem(KEY,JSON.stringify({v:1,docs:Object.fromEntries(docs),meta}));updStatus()}
  catch(e){toast("No se pudo guardar en el dispositivo");const st=document.getElementById("status");if(st){st.textContent="Error al guardar: hacé un respaldo ya";st.className="warn"}}
}
function diasDesde(iso){if(!iso)return null;return Math.floor((fromIso(hoyIso())-fromIso(iso))/864e5)}
function updStatus(){const st=document.getElementById("status");if(!st)return;
  const d=diasDesde(meta.respaldo);
  if(d===null&&docs.size){st.textContent="Sin respaldo todavía";st.className="warn"}
  else if(d!==null&&d>14){st.textContent="Último respaldo hace "+d+" días";st.className="warn"}
  else{st.textContent="Guardado";st.className=""}}
const timers={};
function writeDoc(id,patch,delay=0){
  docs.set(id,{...(docs.get(id)||{}),...patch});
  render();
  clearTimeout(timers[id]);
  timers[id]=setTimeout(()=>{timers[id]=null;guardar()},delay);
}
// Texto libre: se guarda mientras se escribe, sin redibujar la pantalla (así no se pierde nada si se cierra la app)
function typed(id,patch){
  docs.set(id,{...(docs.get(id)||{}),...patch});
  clearTimeout(timers[id]);
  timers[id]=setTimeout(()=>{timers[id]=null;guardar()},400);
}
function deleteDoc(id){clearTimeout(timers[id]);docs.delete(id);guardar();render()}
async function entregar(nombre,blob){
  try{
    const f=new File([blob],nombre,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[f]})&&/iphone|ipad|android/i.test(navigator.userAgent)){await navigator.share({files:[f],title:nombre});return true}
  }catch(e){if(e&&e.name==="AbortError")return false}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return true;
}
async function respaldo(){
  const blob=new Blob([JSON.stringify({app:"bitacora-residencia",v:1,fecha:hoyIso(),docs:Object.fromEntries(docs)},null,1)],{type:"application/json"});
  if(await entregar("Bitacora_respaldo_"+hoyIso()+".json",blob)){meta.respaldo=hoyIso();guardar();render();toast("Respaldo generado")}
}
function restaurar(file){
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(o.app!=="bitacora-residencia"||!o.docs)throw 0;
      docs=new Map(Object.entries(o.docs));guardar();state.confirmRestore=false;render();toast("Respaldo restaurado ("+fmtCorta(o.fecha)+")")}
    catch(e){toast("Ese archivo no es un respaldo de la bitácora")}};
  r.readAsText(file);
}

let tt;function toast(m){const el=document.getElementById("toast");el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2600)}

function cat(a){a=a||"";if(a.startsWith("Poli")||a==="UOC")return["poli","Policlínica"];if(/^(Ateneo|Clase|UMI)/.test(a))return["acad","Ateneo y docencia"];if(/Pautado|papers/i.test(a))return["lect","Pautas y lectura"];if(/Jornada/.test(a))return["evento","Jornada"];return["otro","Actividad"]}
const ICO_STAR='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
const ICO_CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function semana(s){const d=fromIso(s),wd=d.getDay();const l=new Date(d);l.setDate(d.getDate()-(wd===0?6:wd-1));return [0,1,2,3,4].map(i=>{const x=new Date(l);x.setDate(l.getDate()+i);return iso(x)})}
function avance(s){const sl=slots(s);if(!sl.length)return"";const n=sl.filter(x=>reg(s,x).estado).length;return n===sl.length?"full":n?"part":""}

function viewHoy(){
  const s=state.dia,d=fromIso(s),wd=d.getDay();
  const fer=FERIADOS[s],lic=enLicencia(s);
  const fuera=s<INICIO||s>FIN;
  let h=`<div class="daynav">
    <button class="iconbtn" id="prev" aria-label="Día hábil anterior">‹</button>
    <div class="d"><h2><span class="wd">${DIAS[wd]}</span>${d.getDate()} de ${MESL[d.getMonth()]}</h2>
      <div class="tags">${s===hoyIso()?'<span class="tag clay">Hoy</span>':''}${fer?`<span class="tag off">Feriado · ${esc(fer)}</span>`:''}${lic?'<span class="tag off">Licencia</span>':''}</div></div>
    <button class="iconbtn" id="next" aria-label="Día hábil siguiente">›</button>
  </div>
  <div class="week" role="group" aria-label="Semana">${semana(s).map(x=>{const dd=fromIso(x);return `<button data-go="${x}" class="${x===hoyIso()?"hoy":""}" ${x===s?'aria-current="date"':''} aria-label="${DIAS[dd.getDay()]} ${dd.getDate()}"><span class="wl">${DIAS3[dd.getDay()]}</span><span class="wn">${dd.getDate()}</span><span class="dot ${avance(x)}"></span></button>`}).join("")}</div>
  <div class="gorow"><input type="date" id="pick" class="field" style="flex:1;min-width:0" value="${s}" min="${INICIO}" max="${FIN}" aria-label="Ir a fecha">${s!==hoyIso()?'<button class="btn" id="gohoy">Hoy</button>':''}</div>`;
  if(fuera) h+=`<div class="banner off">Esta fecha está fuera del semestre (1/10/2026 – 31/3/2027).</div>`;
  for(const sl of slots(s)){
    const r=reg(s,sl);
    const cls=r.estado==="Cumplida"?"done":(r.estado==="No asistí"||r.estado==="Suspendida")?"missed":(r.estado==="Licencia"||r.estado==="Feriado")?"rest":"";
    const esPoli=(r.act||"").startsWith("Poli")||r.act==="UOC";
    const [ck,cl]=cat(sl.v?r.act:sl.a);
    h+=`<section class="card ${cls}" data-cat="${ck}" aria-label="${esc(sl.v?"Actividad del viernes":sl.a)}">
      <div class="body">
      <div><div class="kind"><span class="cat">${cl}</span>${r.estado==="Feriado"?'<span class="tag off">Feriado</span>':''}${sl.h?`<span class="time">${sl.h}</span>`:''}</div><h3>${esc(sl.v?(r.act||"Viernes sin definir"):sl.a)}</h3></div>`;
    if(sl.v) h+=`<select class="field" id="vari-${sl.id}" data-vari="${sl.id}" aria-label="Actividad del viernes"><option value="">Elegí la actividad</option>${VIERNES.map(o=>`<option ${o===r.vari?"selected":""}>${o}</option>`).join("")}</select>`;
    h+=`<div class="seg4" role="group" aria-label="Estado">${ESTADOS.map(e=>`<button class="chip" data-est="${sl.id}" data-v="${e}" aria-pressed="${r.estado===e}">${e}</button>`).join("")}</div>`;
    if(PRESENTABLES.includes(r.act)){
      h+=`<button class="presbtn" data-pres="${sl.id}" aria-pressed="${r.pres}">${ICO_STAR}<span>Presenté yo</span></button>`;
      if(r.pres) h+=`<input class="field" id="tema-${sl.id}" data-tema="${sl.id}" value="${esc(r.tema)}" placeholder="Tema o caso presentado (opcional)" aria-label="Tema o caso presentado">`;
    }
    if(esPoli) h+=`<div class="row"><span class="small muted" style="flex:1;font-weight:600">Pacientes vistos</span>
      <div class="stepper"><button data-step="${sl.id}" data-d="-1" aria-label="Restar paciente">−</button><input id="pac-${sl.id}" data-pac="${sl.id}" inputmode="numeric" value="${r.pac??""}" placeholder="0" aria-label="Pacientes vistos"><button data-step="${sl.id}" data-d="1" aria-label="Sumar paciente">+</button></div></div>`;
    h+=`<label class="obslbl" for="obs-${sl.id}">Observaciones</label><textarea class="field" id="obs-${sl.id}" data-obs="${sl.id}" rows="1" placeholder="Casos, pendientes, lo que quieras recordar" aria-label="Observaciones">${esc(r.obs)}</textarea></div></section>`;
  }
  const delDia=tareas().filter(t=>t.fecha===s||(t.vence===s&&t.estado!=="Cumplida"));
  h+=`<section class="card plain"><div class="row"><h3 style="flex:1">Tareas del día</h3><button class="btn" id="addhoy">Agregar</button></div>
     ${delDia.length?delDia.map(taskRow).join(""):'<div class="small muted">Nada cargado para este día. Las tareas que crees o que venzan hoy aparecen acá.</div>'}</section>`;
  return h;
}

function taskRow(t){
  const done=t.estado==="Cumplida",v=vencida(t);
  const del=state.confirmDel===t.id;
  return `<div class="task ${done?"isdone":""}">
   <button class="check" role="checkbox" aria-checked="${done}" data-done="${t.id}" aria-label="Marcar como cumplida">${done?ICO_CHECK:""}</button>
   <div class="txt"><div class="desc">${esc(t.desc||t.tipo)}</div>
     <div class="tags"><span class="tag">${esc(t.tipo)}</span>${t.pac?`<span class="tag off">${esc(t.pac)}</span>`:''}${t.cant?`<span class="tag off">${t.cant} pac.</span>`:''}${t.vence?`<span class="tag ${v?"bad":"off"}">${v?"Vencida ":"Vence "}${fmtCorta(t.vence)}</span>`:''}${done&&t.hecho?`<span class="tag off">Hecha ${fmtCorta(t.hecho)}</span>`:''}</div></div>
   ${del?`<button class="btn" data-delok="${t.id}" style="color:var(--bad)">Borrar</button><button class="btn ghost" data-delno="1">No</button>`:`<button class="btn ghost" data-del="${t.id}" aria-label="Borrar tarea">✕</button>`}
  </div>`;
}

function viewTareas(){
  const all=tareas().sort((a,b)=>(a.vence||"9999").localeCompare(b.vence||"9999")||(b.fecha||"").localeCompare(a.fecha||""));
  const f=state.filtro;
  const list=all.filter(t=>f==="todas"?true:f==="hechas"?t.estado==="Cumplida":(t.estado!=="Cumplida"&&t.estado!=="Cancelada"));
  return `<section class="card plain" aria-label="Nueva tarea"><h2>Nueva tarea</h2>
   <div class="grid2"><label class="small muted">Fecha<input type="date" id="t-fecha" class="field" value="${state.dia}"></label>
   <label class="small muted">Vence<input type="date" id="t-vence" class="field"></label></div>
   <select id="t-tipo" class="field" aria-label="Tipo" style="margin-top:6px">${TIPOS.map(t=>`<option>${t}</option>`).join("")}</select>
   <input id="t-desc" class="field" placeholder="Revisar pacientes de poli QT del martes" aria-label="Descripción" style="margin-top:6px">
   <div class="grid2" style="margin-top:6px"><input id="t-pac" class="field" placeholder="Iniciales / registro" aria-label="Paciente"><input id="t-cant" class="field" inputmode="numeric" placeholder="Cantidad" aria-label="Cantidad de pacientes"></div>
   ${state.addErr?`<div class="err">${esc(state.addErr)}</div>`:""}
   <button class="btn primary" id="t-add" style="margin-top:6px">Agregar tarea</button>
   <div class="small muted">Para pacientes, solo iniciales o número de registro.</div>
  </section>
  <div class="seg" role="group" aria-label="Filtro">${[["pend","Pendientes"],["hechas","Cumplidas"],["todas","Todas"]].map(([k,l])=>`<button data-filtro="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}</div>
  <section class="card plain">${list.length?list.map(taskRow).join(""):`<div class="small muted">${f==="pend"?"No tenés tareas pendientes.":"Todavía no hay tareas en esta vista."}</div>`}</section>`;
}

function iterRegistros(cb){
  let d=fromIso(INICIO);const end=fromIso(FIN);
  while(d<=end){const s=iso(d);if(d.getDay()>0&&d.getDay()<6)for(const sl of slots(s))cb(s,sl,reg(s,sl));d.setDate(d.getDate()+1)}
}
function enMes(s,mes){return mes==="all"||(s||"").startsWith(mes)}
function nombreMes(mes){if(mes==="all")return "Semestre completo";const [y,m]=mes.split("-").map(Number);return ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"][m-1]+" "+y}
function stats(mes){
  let pac=0,ok=0,no=0,lic=0;const tab={};POLIS.forEach(p=>tab[p]=MESES.map(()=>0));
  const atn={};PRESENTABLES.forEach(a=>atn[a]={asist:0,pres:0});
  const obs=[],pres=[];
  iterRegistros((s,sl,r)=>{
    if(!enMes(s,mes))return;
    if(r.estado==="Cumplida")ok++;if(r.estado==="No asistí"||r.estado==="Suspendida")no++;if(r.estado==="Licencia"||r.estado==="Feriado")lic++;
    if(r.pac){pac+=r.pac;const mi=MESES.findIndex(([y,m])=>s.startsWith(y+"-"+pad(m)));if(tab[r.act]&&mi>=0)tab[r.act][mi]+=r.pac}
    if(atn[r.act]&&r.estado==="Cumplida"){atn[r.act].asist++;if(r.pres){atn[r.act].pres++;pres.push({s,act:r.act,h:sl.h,tema:r.tema.trim()})}}
    if(r.obs.trim())obs.push({s,act:sl.v?(r.act||"Viernes variable"):sl.a,h:sl.h,txt:r.obs.trim()});
  });
  const ts=tareas().filter(t=>enMes(t.fecha,mes));
  const porTipo=TIPOS.map(t=>{const x=ts.filter(y=>y.tipo===t);return {tipo:t,n:x.length,ok:x.filter(y=>y.estado==="Cumplida").length,pac:x.reduce((a,y)=>a+(Number(y.cant)||0),0)}});
  const cols=mes==="all"?MESES.map((_,i)=>i):[MESES.findIndex(([y,m])=>mes===y+"-"+pad(m))];
  const asistAt=PRESENTABLES.reduce((a,k)=>a+atn[k].asist,0);
  return {pac,ok,no,lic,asist:ok+no?Math.round(ok/(ok+no)*1000)/10:null,ts,hechas:ts.filter(t=>t.estado==="Cumplida").length,venc:ts.filter(vencida).length,pend:ts.filter(t=>t.estado!=="Cumplida"&&t.estado!=="Cancelada").length,tab,cols,porTipo,atn,asistAt,presN:pres.length,pres,obs};
}
const fechaLarga=s=>{const d=fromIso(s);return DIAS3[d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1)};
function viewResumen(){
  const mes=state.mes,st=stats(mes);
  const opts=[["all","Semestre completo"],...MESES.map(([y,m])=>[y+"-"+pad(m),nombreMes(y+"-"+pad(m))])];
  const tot=st.cols.map(i=>POLIS.reduce((a,p)=>a+st.tab[p][i],0));
  let lastGrupo="";
  const obsHtml=st.obs.map(o=>{
    const g=mes==="all"&&o.s.slice(0,7)!==lastGrupo?(lastGrupo=o.s.slice(0,7),`<h4>${nombreMes(lastGrupo)}</h4>`):"";
    return g+`<div class="li"><div class="meta"><b>${fechaLarga(o.s)}</b> · ${esc(o.act)}</div><div class="txt">${esc(o.txt)}</div></div>`}).join("");
  return `<select id="mes" class="field" aria-label="Período">${opts.map(([k,l])=>`<option value="${k}" ${k===mes?"selected":""}>${l}</option>`).join("")}</select>
   <div class="grid2">
    <div class="metric"><span class="lbl">Pacientes vistos</span><b>${st.pac}</b></div>
    <div class="metric ok"><span class="lbl">Asistencia</span><b>${st.asist===null?"—":st.asist.toFixed(1)+"%"}</b><span class="sub">${st.ok} cumplidas · ${st.no} no</span></div>
    <div class="metric clay"><span class="lbl">Presentaciones</span><b>${st.presN}</b><span class="sub">de ${st.asistAt} actividades asistidas</span></div>
    <div class="metric indigo"><span class="lbl">Observaciones</span><b>${st.obs.length}</b><span class="sub">registros con nota</span></div>
    <div class="metric ochre"><span class="lbl">Tareas cumplidas</span><b>${st.hechas}/${st.ts.length}</b></div>
    <div class="metric off"><span class="lbl">Tareas vencidas</span><b>${st.venc}</b></div>
   </div>
   <div class="sec"><h2>Presentaciones</h2></div>
   <div class="tablewrap"><table><thead><tr><th>Actividad</th><th>Asistidos</th><th>Presenté</th><th>%</th></tr></thead><tbody>
    ${PRESENTABLES.map(a=>{const x=st.atn[a];return `<tr><td>${esc(a)}</td><td>${x.asist}</td><td>${x.pres}</td><td>${x.asist?Math.round(x.pres/x.asist*100)+"%":"·"}</td></tr>`}).join("")}
    <tr class="total"><td>Total</td><td>${st.asistAt}</td><td>${st.presN}</td><td>${st.asistAt?Math.round(st.presN/st.asistAt*100)+"%":"·"}</td></tr></tbody></table></div>
   ${st.pres.length?`<div class="list">${st.pres.map(p=>`<div class="li"><div class="meta"><b>${fechaLarga(p.s)}</b> · <span class="clayt">${esc(p.act)}</span></div><div class="txt pres">${p.tema?esc(p.tema):'<span class="muted" style="font-weight:400">Sin tema anotado</span>'}</div></div>`).join("")}</div>`:'<div class="small muted">Todavía no marcaste ninguna presentación en este período.</div>'}
   <div class="sec"><h2>Observaciones</h2><span class="small">${st.obs.length}</span></div>
   ${st.obs.length?`<div class="list">${obsHtml}</div>`:'<div class="small muted">No escribiste observaciones en este período.</div>'}
   <div class="sec"><h2>Pacientes por policlínica</h2></div>
   <div class="tablewrap"><table><thead><tr><th>Policlínica</th>${st.cols.map(i=>`<th>${MESN[MESES[i][1]-1]} ${String(MESES[i][0]).slice(2)}</th>`).join("")}${st.cols.length>1?"<th>Total</th>":""}</tr></thead><tbody>
    ${POLIS.map(p=>`<tr><td>${esc(p)}</td>${st.cols.map(i=>`<td>${st.tab[p][i]||"·"}</td>`).join("")}${st.cols.length>1?`<td><b>${st.cols.reduce((a,i)=>a+st.tab[p][i],0)}</b></td>`:""}</tr>`).join("")}
    <tr class="total"><td>Total</td>${tot.map(n=>`<td>${n}</td>`).join("")}${st.cols.length>1?`<td>${tot.reduce((a,b)=>a+b,0)}</td>`:""}</tr></tbody></table></div>
   <div class="sec"><h2>Tareas por tipo</h2></div>
   <div class="tablewrap"><table><thead><tr><th>Tipo</th><th>Total</th><th>Cumplidas</th><th>Pac.</th></tr></thead><tbody>
    ${st.porTipo.map(x=>`<tr><td>${esc(x.tipo)}</td><td>${x.n}</td><td>${x.ok}</td><td>${x.pac}</td></tr>`).join("")}</tbody></table></div>
   <button class="btn primary" id="export" ${window.XLSX?"":"disabled"}>Descargar Excel · ${esc(nombreMes(mes))}</button>
   <div class="small muted">El archivo trae cuatro hojas: Resumen, Registro diario, Observaciones y Tareas extra del período elegido.</div>
   <section class="card plain" aria-label="Respaldo">
    <h2>Respaldo</h2>
    <div class="small muted">Los datos viven solo en este dispositivo. Hacé un respaldo cada semana y guardalo en Drive: sirve para recuperar todo si cambiás o perdés el celular.</div>
    <div class="small">${meta.respaldo?"Último respaldo: "+fmtCorta(meta.respaldo):"Todavía no hiciste ningún respaldo."}</div>
    <button class="btn" id="bk">Descargar respaldo</button>
    ${state.confirmRestore?`<div class="banner warn">Restaurar reemplaza todo lo cargado en este dispositivo por el contenido del archivo.</div>
      <label class="btn" style="text-align:center">Elegir archivo de respaldo<input type="file" id="rs-file" accept=".json,application/json" hidden></label>
      <button class="btn ghost" id="rs-no">Cancelar</button>`:'<button class="btn ghost" id="rs">Restaurar desde un respaldo</button>'}
   </section>`;
}

function autogrow(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight+2,360)+"px"}
function render(){
  const ae=document.activeElement,aid=ae&&ae.id,sel=aid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;
  const v=document.getElementById("view");
  v.innerHTML=state.tab==="hoy"?viewHoy():state.tab==="tareas"?viewTareas():viewResumen();
  v.querySelectorAll("textarea").forEach(autogrow);
  if(aid){const el=document.getElementById(aid);if(el){el.focus({preventScroll:true});if(sel&&el.setSelectionRange)try{el.setSelectionRange(...sel)}catch(e){}}}
  document.querySelectorAll("nav.tabs button").forEach(b=>b.dataset.tab===state.tab?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.tab){state.tab=t.dataset.tab;state.confirmDel=null;render();window.scrollTo(0,0);return}
  if(t.id==="prev"){state.dia=diaHabil(state.dia,-1);render();return}
  if(t.id==="next"){state.dia=diaHabil(state.dia,1);render();return}
  if(t.id==="gohoy"){state.dia=diaInicial();render();return}
  if(t.dataset.go){state.dia=t.dataset.go;render();return}
  if(t.dataset.est){const id=t.dataset.est,cur=docs.get(id)?.estado,nuevo=cur===t.dataset.v?"":t.dataset.v;
    // Presenté implica que asistí: si el estado deja de ser "Cumplida", se desmarca la presentación
    writeDoc(id,{type:"reg",fecha:id.slice(2,12),estado:nuevo,...(nuevo!=="Cumplida"?{pres:false}:{})});return}
  if(t.dataset.pres){const id=t.dataset.pres,on=!docs.get(id)?.pres;
    writeDoc(id,{type:"reg",fecha:id.slice(2,12),pres:on,...(on?{estado:"Cumplida"}:{})});return}
  if(t.dataset.step){const id=t.dataset.step,s=id.slice(2,12),sl=slots(s).find(x=>x.id===id),r=reg(s,sl);const n=Math.max(0,(r.pac||0)+Number(t.dataset.d));writeDoc(id,{type:"reg",fecha:s,pac:n},700);return}
  if(t.dataset.done){const id=t.dataset.done,cur=docs.get(id);const done=cur.estado==="Cumplida";writeDoc(id,{estado:done?"Pendiente":"Cumplida",hecho:done?"":hoyIso()});return}
  if(t.dataset.del){state.confirmDel=t.dataset.del;render();return}
  if(t.dataset.delno){state.confirmDel=null;render();return}
  if(t.dataset.delok){state.confirmDel=null;deleteDoc(t.dataset.delok);toast("Tarea borrada");return}
  if(t.dataset.filtro){state.filtro=t.dataset.filtro;render();return}
  if(t.id==="addhoy"){state.tab="tareas";render();document.getElementById("t-desc")?.focus();return}
  if(t.id==="t-add"){addTask();return}
  if(t.id==="export"){exportar();return}
  if(t.id==="bk"){respaldo();return}
  if(t.id==="rs"){state.confirmRestore=true;render();return}
  if(t.id==="rs-no"){state.confirmRestore=false;render();return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="mes"){state.mes=t.value;render();return}
  if(t.id==="rs-file"&&t.files&&t.files[0]){restaurar(t.files[0]);return}
  if(t.id==="pick"&&t.value){let s=t.value;const wd=fromIso(s).getDay();if(wd===0||wd===6)s=diaHabil(s,1);state.dia=s;render();return}
  if(t.dataset.vari){const id=t.dataset.vari;writeDoc(id,{type:"reg",fecha:id.slice(2,12),vari:t.value});return}
  if(t.dataset.pac){const id=t.dataset.pac;const n=t.value.trim()===""?null:Math.max(0,parseInt(t.value,10)||0);writeDoc(id,{type:"reg",fecha:id.slice(2,12),pac:n});return}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.obs){typed(t.dataset.obs,{type:"reg",fecha:t.dataset.obs.slice(2,12),obs:t.value});autogrow(t);return}
  if(t.dataset.tema){typed(t.dataset.tema,{type:"reg",fecha:t.dataset.tema.slice(2,12),tema:t.value});return}
  if(t.id&&t.id.startsWith("t-")&&state.addErr){state.addErr="";const el=document.querySelector(".err");if(el)el.remove()}
});
// Si la app pasa a segundo plano o se cierra a mitad de una nota, se guarda lo pendiente
window.addEventListener("pagehide",guardar);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")guardar()});

function addTask(){
  const g=id=>document.getElementById(id).value.trim();
  const desc=g("t-desc"),fecha=g("t-fecha");
  if(!desc){state.addErr="Escribí una descripción.";render();document.getElementById("t-desc").focus();return}
  if(!fecha){state.addErr="Elegí la fecha.";render();return}
  const cant=g("t-cant")===""?null:Math.max(0,parseInt(g("t-cant"),10)||0);
  const id="t_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  state.addErr="";
  writeDoc(id,{type:"tarea",fecha,tipo:g("t-tipo"),desc,pac:g("t-pac"),cant,vence:g("t-vence"),estado:"Pendiente",hecho:"",creada:Date.now()});
  ["t-desc","t-pac","t-cant","t-vence"].forEach(i=>{const el=document.getElementById(i);if(el)el.value=""});
  toast("Tarea agregada");
}

const xd=s=>s?{t:"n",v:(Date.UTC(...s.split("-").map((x,i)=>i===1?x-1:+x))-Date.UTC(1899,11,30))/864e5,z:"dd/mm/yyyy"}:"";
async function exportar(){
  const mes=state.mes,st=stats(mes);
  const rs=[["Bitácora de residencia — "+nombreMes(mes)],["Generado",xd(hoyIso())],[],
    ["Indicador","Valor"],["Pacientes vistos",st.pac],["Actividades cumplidas",st.ok],["No asistidas / suspendidas",st.no],["Feriados / licencia",st.lic],
    ["% asistencia (excluye feriados y licencias)",st.asist===null?"":st.asist/100],
    ["Presentaciones (Ateneo INCA, Clase clínica y UMI)",st.presN],["Actividades asistidas (Ateneo INCA, Clase clínica y UMI)",st.asistAt],["Observaciones escritas",st.obs.length],
    ["Tareas registradas",st.ts.length],["Tareas cumplidas",st.hechas],["Tareas pendientes",st.pend],["Tareas vencidas",st.venc],[],
    ["Presentaciones","Asistidos","Presenté","% presenté"]];
  PRESENTABLES.forEach(a=>{const x=st.atn[a];rs.push([a,x.asist,x.pres,x.asist?x.pres/x.asist:""])});
  rs.push(["Total",st.asistAt,st.presN,st.asistAt?st.presN/st.asistAt:""],[]);
  rs.push(["Pacientes por policlínica",...st.cols.map(i=>MESN[MESES[i][1]-1]+" "+MESES[i][0]),...(st.cols.length>1?["Total"]:[])]);
  POLIS.forEach(p=>rs.push([p,...st.cols.map(i=>st.tab[p][i]),...(st.cols.length>1?[st.cols.reduce((a,i)=>a+st.tab[p][i],0)]:[])]));
  rs.push(["Total",...st.cols.map(i=>POLIS.reduce((a,p)=>a+st.tab[p][i],0)),...(st.cols.length>1?[st.pac]:[])]);
  rs.push([],["Tareas por tipo","Registradas","Cumplidas","Pacientes"]);
  st.porTipo.forEach(x=>rs.push([x.tipo,x.n,x.ok,x.pac]));
  const regs=[["Fecha","Día","Horario","Actividad","Estado","Pacientes vistos","Presenté","Tema presentado","Observaciones","Feriado"]];
  iterRegistros((s,sl,r)=>{if(enMes(s,mes))regs.push([xd(s),DIAS[fromIso(s).getDay()],sl.h,sl.v?(r.act||"Viernes variable"):sl.a,r.estado,r.pac??"",PRESENTABLES.includes(r.act)&&r.estado==="Cumplida"&&r.pres?"Sí":"",r.pres?r.tema:"",r.obs,FERIADOS[s]||""])});
  const ob=[["Fecha","Día","Horario","Actividad","Observación"]];
  st.obs.forEach(o=>ob.push([xd(o.s),DIAS[fromIso(o.s).getDay()],o.h,o.act,o.txt]));
  const tk=[["Fecha","Tipo","Descripción","Paciente","Cantidad","Vence","Estado","Fecha cumplida"]];
  st.ts.sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")).forEach(t=>tk.push([xd(t.fecha),t.tipo,t.desc,t.pac||"",t.cant??"",xd(t.vence),t.estado,xd(t.hecho)]));
  const wb=XLSX.utils.book_new();
  const w0=XLSX.utils.aoa_to_sheet(rs,{cellDates:true,dateNF:"dd/mm/yyyy"});w0["!cols"]=[{wch:42},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10}];
  const fmtPct=(ref)=>{if(w0[ref]&&typeof w0[ref].v==="number")w0[ref].z="0.0%"};
  fmtPct("B9");
  const filaAt=rs.findIndex(r=>r[0]==="Presentaciones")+1;
  for(let i=1;i<=PRESENTABLES.length+1;i++)fmtPct("D"+(filaAt+i));
  const w1=XLSX.utils.aoa_to_sheet(regs,{cellDates:true,dateNF:"dd/mm/yyyy"});w1["!cols"]=[{wch:11},{wch:10},{wch:13},{wch:28},{wch:11},{wch:9},{wch:9},{wch:30},{wch:50},{wch:24}];
  const w3=XLSX.utils.aoa_to_sheet(ob,{cellDates:true,dateNF:"dd/mm/yyyy"});w3["!cols"]=[{wch:11},{wch:10},{wch:13},{wch:28},{wch:80}];
  const w2=XLSX.utils.aoa_to_sheet(tk,{cellDates:true,dateNF:"dd/mm/yyyy"});w2["!cols"]=[{wch:11},{wch:26},{wch:40},{wch:18},{wch:9},{wch:11},{wch:11},{wch:13}];
  XLSX.utils.book_append_sheet(wb,w0,"Resumen");XLSX.utils.book_append_sheet(wb,w1,"Registro diario");XLSX.utils.book_append_sheet(wb,w3,"Observaciones");XLSX.utils.book_append_sheet(wb,w2,"Tareas extra");
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  const nom=mes==="all"?"semestre":mes;
  await entregar("Bitacora_residencia_"+nom+".xlsx",new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
}

cargar();render();updStatus();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
